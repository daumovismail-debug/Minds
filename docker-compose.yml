services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-minds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minds_password}
      POSTGRES_DB: ${POSTGRES_DB:-minds}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minds} -d ${POSTGRES_DB:-minds}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-minds}:${POSTGRES_PASSWORD:-minds_password}@db:5432/${POSTGRES_DB:-minds}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      DUPLICATE_THRESHOLD: ${DUPLICATE_THRESHOLD:-0.85}
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3001}:3000"

volumes:
  postgres-data:
